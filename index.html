<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Luxury Tree - Folder Auto-Read</title>
    <link rel="preconnect" href="https://fastly.jsdelivr.net" crossorigin>
    <link rel="preload" href="./hand_landmarker.task" as="fetch" crossorigin>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; font-family: 'Times New Roman', serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI Overlay */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; 
            align-items: center;
            padding-top: 40px;
            box-sizing: border-box;
            transition: opacity 0.5s ease;
        }
        
        .ui-hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Loading */
        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease-out;
        }
        .loader-text {
            color: #d4af37; font-size: 14px; letter-spacing: 4px; margin-top: 20px;
            text-transform: uppercase; font-weight: 100;
        }
        .spinner {
            width: 40px; height: 40px; border: 1px solid rgba(212, 175, 55, 0.2); 
            border-top: 1px solid #d4af37; border-radius: 50%; 
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Typography */
        h1 { 
            color: #fceea7; font-size: clamp(26px, 4.6vw, 52px); margin: 0; font-weight: 400; 
            letter-spacing: 5px; text-align: center; padding: 0 56px;
            text-shadow: 0 0 40px rgba(252, 238, 167, 0.55); 
            background: linear-gradient(to bottom, #ffffff, var(--accent-light, #eebb66));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-family: 'Cinzel', 'Songti SC', 'STSong', 'Times New Roman', serif;
            opacity: 0.94;
            transition: opacity 0.5s ease;
            pointer-events: auto;
            cursor: pointer;
        }

        /* 实时手势识别反馈徽章 */
        #gesture-badge {
            margin-top: 10px;
            padding: 5px 14px;
            border-radius: 999px;
            background: rgba(14, 14, 22, 0.68);
            border: 1px solid rgba(255, 224, 150, 0.45);
            color: #fff2cc;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
            font-size: 12px;
            letter-spacing: 1.5px;
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateY(-6px);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
        }
        #gesture-badge.active { opacity: 1; transform: translateY(0); }

        /* 右上角纯净欣赏/截图隐藏按钮 */
        #pure-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 80;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid rgba(255, 224, 150, 0.35);
            background: rgba(14, 14, 20, 0.55);
            color: #f3dc98;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            transition: all 0.25s ease;
        }
        #pure-btn:hover { background: rgba(212, 175, 55, 0.3); transform: scale(1.06); }
        body.pure-mode #bottom-dock,
        body.pure-mode #gesture-status,
        body.pure-mode #webcam-wrapper,
        body.pure-mode #gesture-badge {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* 底部极简毛玻璃悬浮控制坞（绝不遮挡标题与圣诞树！） */
        #bottom-dock {
            position: fixed;
            bottom: 42px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 65;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            max-width: 96vw;
            transition: opacity 0.4s ease;
        }

        .theme-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(14, 14, 20, 0.68);
            border: 1px solid rgba(255, 224, 150, 0.24);
            backdrop-filter: blur(12px);
        }
        .theme-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.28);
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            padding: 0;
        }
        .theme-dot:hover { transform: scale(1.16); }
        .theme-dot.active {
            border-color: #ffffff;
            transform: scale(1.18);
            box-shadow: 0 0 12px rgba(255,255,255,0.75);
        }
        .color-picker-wrap {
            position: relative;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: conic-gradient(#ff5e8e, #ffd966, #66e0ff, #b388ff, #ff5e8e);
            border: 2px solid rgba(255,255,255,0.45);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .color-picker-wrap:hover { transform: scale(1.15); }
        #custom-color {
            position: absolute;
            inset: -6px;
            width: 40px;
            height: 40px;
            opacity: 0;
            cursor: pointer;
        }

        .action-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 7px;
            padding: 6px 10px;
            border-radius: 16px;
            background: rgba(14, 14, 20, 0.68);
            border: 1px solid rgba(255, 224, 150, 0.24);
            backdrop-filter: blur(12px);
        }
        .dock-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 224, 150, 0.26);
            color: #f3e2b3;
            padding: 7px 11px;
            border-radius: 999px;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
            font-size: 12px;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            transition: all 0.22s ease;
        }
        .dock-btn:hover { background: rgba(255, 224, 150, 0.22); color: #fff; }
        .dock-btn.active {
            background: rgba(255, 214, 120, 0.28);
            border-color: rgba(255, 228, 160, 0.8);
            color: #fff;
            box-shadow: 0 0 12px rgba(255, 214, 120, 0.35);
        }

        input[type="file"] { display: none; }

        /* 主画面发光魔法手掌光效层（抖音爆款同款指尖星光！） */
        #hand-magic-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 15;
            pointer-events: none;
        }

        /* Webcam feedback + 实时发光手掌骨骼叠加层 */
        #webcam-wrapper {
            position: fixed;
            top: 66px;
            left: 16px;
            width: 180px;
            height: 135px;
            border: 1px solid rgba(255, 224, 150, 0.45);
            box-shadow: 0 6px 24px rgba(0,0,0,0.8);
            border-radius: 10px;
            overflow: hidden;
            opacity: 1;
            pointer-events: none;
            z-index: 50;
            background: #000;
            transition: opacity 0.4s ease;
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        #webcam-skeleton {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #gesture-status {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 60;
            padding: 4px 12px;
            border-radius: 999px;
            background: rgba(12, 12, 16, 0.65);
            border: 1px solid rgba(212, 175, 55, 0.25);
            color: rgba(243, 220, 152, 0.88);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
            font-size: 11px;
            letter-spacing: 0.8px;
            white-space: nowrap;
            backdrop-filter: blur(8px);
            pointer-events: none;
            transition: opacity 0.4s ease;
            max-width: 94vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 定制祝福语 & 生成专属链接弹窗 */
        #share-modal {
            position: fixed;
            inset: 0;
            z-index: 120;
            background: rgba(0, 0, 0, 0.68);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #share-modal.open { display: flex; }
        .modal-card {
            width: min(92vw, 360px);
            background: rgba(18, 18, 28, 0.94);
            border: 1px solid rgba(255, 224, 150, 0.35);
            border-radius: 18px;
            padding: 20px;
            color: #fff6e5;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
            box-shadow: 0 20px 50px rgba(0,0,0,0.85);
        }
        .modal-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffe39e;
        }
        .modal-close {
            background: none; border: none; color: #aaa; font-size: 22px; cursor: pointer; line-height: 1;
        }
        .modal-label { font-size: 12px; color: #bbb; margin-bottom: 6px; display: block; }
        .modal-input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 224, 150, 0.32);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 14px;
            outline: none;
            margin-bottom: 14px;
        }
        .modal-input:focus { border-color: #ffd966; }
        .modal-btn {
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #ffd966, #e6a83a);
            color: #1a1204;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        .modal-btn:active { transform: scale(0.98); }
        .modal-tip { font-size: 11px; color: #9ea8b8; margin-top: 10px; line-height: 1.5; text-align: center; }

        /* 手机竖屏完美适配 */
        @media (max-width: 768px) {
            #ui-layer { padding-top: 16px; }
            #webcam-wrapper {
                top: 62px;
                left: 10px;
                width: 96px;
                height: 128px;
            }
            #bottom-dock { bottom: 38px; gap: 6px; }
            .dock-btn { padding: 6px 9px; font-size: 11px; }
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
            }
        }
    </script>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text">Loading Memories</div>
    </div>

    <div id="canvas-container"></div>
    <canvas id="hand-magic-canvas"></canvas>

    <div id="ui-layer">
        <h1 id="main-title" title="点击修改专属祝福语">Merry Christmas</h1>
        <div id="gesture-badge">✨ 手势已锁定</div>
    </div>

    <button id="pure-btn" type="button" title="隐藏/显示界面 (纯净截图)">👁️</button>

    <div id="webcam-wrapper" style="display:none;">
        <video id="webcam" autoplay playsinline webkit-playsinline muted></video>
        <canvas id="webcam-skeleton"></canvas>
        <canvas id="webcam-preview" style="display:none;"></canvas>
    </div>

    <div id="bottom-dock">
        <div class="theme-bar" title="切换圣诞树颜色">
            <button class="theme-dot active" data-theme="classic" style="background:linear-gradient(135deg,#ffd966,#0c5e2b)" title="经典鎏金绿"></button>
            <button class="theme-dot" data-theme="pink" style="background:linear-gradient(135deg,#ffd1e8,#ff4d9e)" title="迪奥粉钻"></button>
            <button class="theme-dot" data-theme="ice" style="background:linear-gradient(135deg,#d6f4ff,#1e78d6)" title="冰雪艾莎蓝"></button>
            <button class="theme-dot" data-theme="violet" style="background:linear-gradient(135deg,#eccfff,#6d28d9)" title="极光冰紫"></button>
            <button class="theme-dot" data-theme="crimson" style="background:linear-gradient(135deg,#ffd98a,#c8102e)" title="炽焰圣诞红"></button>
            <label class="color-picker-wrap" title="自由调色盘">
                <input type="color" id="custom-color" value="#ffd966" />
            </label>
        </div>
        <div class="action-bar">
            <button class="dock-btn" id="cam-btn" type="button">📷 摄像头</button>
            <label class="dock-btn">
                🖼️ 传照片
                <input type="file" id="file-input" multiple accept="image/*">
            </label>
            <button class="dock-btn" id="clear-photos-btn" type="button">🗑️ 清空照片</button>
            <button class="dock-btn active" id="snow-btn" type="button">❄️ 飘雪</button>
            <button class="dock-btn" id="music-btn" type="button">🎵 八音盒</button>
            <button class="dock-btn" id="share-btn" type="button">🎁 定制分享</button>
        </div>
    </div>

    <div id="gesture-status">正在初始化手势引擎…</div>

    <div id="share-modal">
        <div class="modal-card">
            <div class="modal-title">
                <span>🎁 定制专属圣诞树</span>
                <button class="modal-close" id="modal-close" type="button">×</button>
            </div>
            <label class="modal-label">顶部专属祝福语（可写上 TA 的名字）</label>
            <input class="modal-input" id="greeting-input" type="text" maxlength="26" value="Merry Christmas" placeholder="例如：To 小美 · 圣诞快乐" />
            <button class="modal-btn" id="copy-link-btn" type="button">复制专属分享链接</button>
            <div class="modal-tip" id="copy-tip">链接会自动记住你的祝福语和圣诞树配色，发给好友点开即见！</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'; 
        import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';

        // --- 核心配置 ---
        const CONFIG = {
            colors: {
                bg: 0x000000, 
                champagneGold: 0xffd966, 
                deepGreen: 0x03180a,     
                accentRed: 0x990000,     
            },
            particles: {
                count: 1500,     
                dustCount: 2500, 
                treeHeight: 24,  
                treeRadius: 8    
            },
            camera: { z: 50 },
            
            // --- 自动读取配置 ---
            preload: {
                // 关闭盲扫 200 张本地图，避免手机端产生 400 个 404 请求卡顿
                autoScanLocal: false,
                scanCount: 0,
                
                // 固定在线演示图片 (始终加载)
                images: [
                    'https://images.unsplash.com/photo-1543589077-47d81606c1bf?q=80&w=600', 
                    'https://images.unsplash.com/photo-1576919228236-a097c32a5cd4?q=80&w=600',
                    'https://images.unsplash.com/photo-1512389142860-9c449e58a543?q=80&w=600'
                ]
            }
        };

        const STATE = {
            mode: 'TREE', 
            focusIndex: -1, 
            focusTarget: null,
            hand: { detected: false, x: 0, y: 0 },
            rotation: { x: 0, y: 0 } 
        };

        let scene, camera, renderer, composer;
        let mainGroup; 
        let clock = new THREE.Clock();
        let particleSystem = []; 
        let photoMeshGroup = new THREE.Group();
        let handLandmarker, video, webcamCanvas, webcamCtx;
        let caneTexture;
        let cameraRunning = false;
        let modelReady = false;
        let predictLoopStarted = false;

        // 动态换色共享材质与灯光句柄 + 3D 飘雪
        let matGold, matGreen, matRed, matStar, matDust, lightInner, lightGold, lightBlue;
        let snowPoints = null, snowPosArr = null, snowEnabled = true;
        let activeThemeKey = 'classic';
        let activeCustomHex = '';
        let activeGlowHex = '#ffd966';

        const THEMES = {
            classic: {
                name: '经典鎏金绿',
                gold: 0xffd966, goldEm: 0x443300,
                green: 0x063016, greenEm: 0x00240b,
                red: 0xb80f1a, redEm: 0x3b0408,
                star: 0xffdd88, starEm: 0xffaa00,
                dust: 0xffeebb, lightIn: 0xffaa00, lightA: 0xffcc66, lightB: 0x6688ff,
                accentCss: '#eebb66', glowHex: '#ffd966'
            },
            pink: {
                name: '迪奥粉钻',
                gold: 0xffc8e2, goldEm: 0x5c1438,
                green: 0xd9387a, greenEm: 0x450924,
                red: 0xfff0f7, redEm: 0x663350,
                star: 0xffe0f0, starEm: 0xff66aa,
                dust: 0xffd6eb, lightIn: 0xff77bb, lightA: 0xffb3d9, lightB: 0xc299ff,
                accentCss: '#ff99cc', glowHex: '#ff8ec7'
            },
            ice: {
                name: '冰雪艾莎蓝',
                gold: 0xb8ecff, goldEm: 0x164a6e,
                green: 0x104a8c, greenEm: 0x08234a,
                red: 0xeaf8ff, redEm: 0x336688,
                star: 0xdff6ff, starEm: 0x44b8ff,
                dust: 0xd6f4ff, lightIn: 0x55c2ff, lightA: 0x9ee2ff, lightB: 0x8099ff,
                accentCss: '#9ee2ff', glowHex: '#7ad7ff'
            },
            violet: {
                name: '极光冰紫',
                gold: 0xe6c2ff, goldEm: 0x3e1566,
                green: 0x41187d, greenEm: 0x1c083d,
                red: 0x80f0ff, redEm: 0x124b5c,
                star: 0xf2dcff, starEm: 0xb266ff,
                dust: 0xe5ccff, lightIn: 0xb86bff, lightA: 0xd9a8ff, lightB: 0x55e0ff,
                accentCss: '#d9a8ff', glowHex: '#c98aff'
            },
            crimson: {
                name: '炽焰圣诞红',
                gold: 0xffd275, goldEm: 0x522a00,
                green: 0x8f0b18, greenEm: 0x380308,
                red: 0xff4252, redEm: 0x5c0810,
                star: 0xffe49e, starEm: 0xff7722,
                dust: 0xffdbb0, lightIn: 0xff5522, lightA: 0xffb366, lightB: 0xff4466,
                accentCss: '#ffaa77', glowHex: '#ff8855'
            }
        };

        function applyTheme(key) {
            const t = THEMES[key] || THEMES.classic;
            activeThemeKey = key;
            activeCustomHex = '';
            activeGlowHex = t.glowHex;
            if (matGold)  { matGold.color.setHex(t.gold);   matGold.emissive.setHex(t.goldEm); }
            if (matGreen) { matGreen.color.setHex(t.green); matGreen.emissive.setHex(t.greenEm); }
            if (matRed)   { matRed.color.setHex(t.red);     matRed.emissive.setHex(t.redEm); }
            if (matStar)  { matStar.color.setHex(t.star);   matStar.emissive.setHex(t.starEm); }
            if (matDust)  { matDust.color.setHex(t.dust); }
            if (lightInner) lightInner.color.setHex(t.lightIn);
            if (lightGold)  lightGold.color.setHex(t.lightA);
            if (lightBlue)  lightBlue.color.setHex(t.lightB);
            document.documentElement.style.setProperty('--accent-light', t.accentCss);
            document.querySelectorAll('.theme-dot').forEach(d => d.classList.toggle('active', d.dataset.theme === key));
        }

        function applyCustomColor(hex) {
            activeThemeKey = 'custom';
            activeCustomHex = hex;
            activeGlowHex = hex;
            const c = new THREE.Color(hex);
            const hsl = {}; c.getHSL(hsl);
            const dark = new THREE.Color().setHSL(hsl.h, Math.min(1, hsl.s * 1.05), Math.max(0.14, hsl.l * 0.42));
            const bright = new THREE.Color().setHSL(hsl.h, Math.min(1, hsl.s * 0.85), Math.min(0.88, hsl.l + 0.22));
            const accent = new THREE.Color().setHSL((hsl.h + 0.08) % 1, Math.min(1, hsl.s), Math.min(0.82, hsl.l + 0.14));
            if (matGold)  { matGold.color.copy(bright); matGold.emissive.copy(dark); }
            if (matGreen) { matGreen.color.copy(dark);  matGreen.emissive.copy(dark).multiplyScalar(0.5); }
            if (matRed)   { matRed.color.copy(accent);  matRed.emissive.copy(dark); }
            if (matStar)  { matStar.color.copy(bright); matStar.emissive.copy(c); }
            if (matDust)  { matDust.color.copy(bright); }
            if (lightInner) lightInner.color.copy(c);
            if (lightGold)  lightGold.color.copy(bright);
            if (lightBlue)  lightBlue.color.copy(accent);
            document.documentElement.style.setProperty('--accent-light', '#' + bright.getHexString());
            document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
        }

        function setStatus(text) {
            const el = document.getElementById('gesture-status');
            if (el) el.textContent = text;
        }

        function applyUrlParams() {
            const params = new URLSearchParams(location.search);
            const to = params.get('to');
            const theme = params.get('theme');
            const color = params.get('color');
            if (to) {
                const titleEl = document.getElementById('main-title');
                const inputEl = document.getElementById('greeting-input');
                if (titleEl) titleEl.textContent = to;
                if (inputEl) inputEl.value = to;
            }
            if (color && /^#[0-9a-fA-F]{6}$/.test(color)) {
                const picker = document.getElementById('custom-color');
                if (picker) picker.value = color;
                applyCustomColor(color);
            } else if (theme && THEMES[theme]) {
                applyTheme(theme);
            }
        }

        // --- 增强版图片加载系统 ---

                for (let i = 1; i <= CONFIG.preload.scanCount; i++) {

                        (t) => { t.colorSpace = THREE.SRGBColorSpace; addPhotoToScene(t); },

                        () => {

                                (t) => { t.colorSpace = THREE.SRGBColorSpace; addPhotoToScene(t); },

        function createTextures() {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0,0,128,128);
            ctx.fillStyle = '#880000'; 
            ctx.beginPath();
            for(let i=-128; i<256; i+=32) {
                ctx.moveTo(i, 0); ctx.lineTo(i+32, 128); ctx.lineTo(i+16, 128); ctx.lineTo(i-16, 0);
            }
            ctx.fill();
            caneTexture = new THREE.CanvasTexture(canvas);
            caneTexture.wrapS = THREE.RepeatWrapping;
            caneTexture.wrapT = THREE.RepeatWrapping;
            caneTexture.repeat.set(3, 3);
        }

        class Particle {
            constructor(mesh, type, isDust = false) {
                this.mesh = mesh;
                this.type = type;
                this.isDust = isDust;
                
                this.posTree = new THREE.Vector3();
                this.posScatter = new THREE.Vector3();
                this.baseScale = mesh.scale.x; 

                const speedMult = (type === 'PHOTO') ? 0.3 : 2.0;

                this.spinSpeed = new THREE.Vector3(
                    (Math.random() - 0.5) * speedMult,
                    (Math.random() - 0.5) * speedMult,
                    (Math.random() - 0.5) * speedMult
                );

                this.calculatePositions();
            }

            calculatePositions() {
                if (this.type === 'PHOTO') {
                    this.posTree.set(0, 0, 0); 
                    const rScatter = 8 + Math.random()*12;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    this.posScatter.set(
                        rScatter * Math.sin(phi) * Math.cos(theta),
                        rScatter * Math.sin(phi) * Math.sin(theta),
                        rScatter * Math.cos(phi)
                    );
                    return;
                }

                const h = CONFIG.particles.treeHeight;
                const halfH = h / 2;
                let t = Math.random(); 
                t = Math.pow(t, 0.8); 
                const y = (t * h) - halfH;
                
                let rMax = CONFIG.particles.treeRadius * (1.0 - t); 
                if (rMax < 0.5) rMax = 0.5;

                const angle = t * 50 * Math.PI + Math.random() * Math.PI; 
                // 收紧树冠锥体轮廓，彻底消除树底零散掉落感！
                const r = rMax * (0.52 + Math.random() * 0.48); 
                this.posTree.set(Math.cos(angle) * r, y, Math.sin(angle) * r);

                let rScatter = this.isDust ? (12 + Math.random()*20) : (8 + Math.random()*12);
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                this.posScatter.set(
                    rScatter * Math.sin(phi) * Math.cos(theta),
                    rScatter * Math.sin(phi) * Math.sin(theta),
                    rScatter * Math.cos(phi)
                );
            }

            update(dt, mode, focusTargetMesh) {
                let target = this.posTree;
                
                if (mode === 'SCATTER') target = this.posScatter;
                else if (mode === 'FOCUS') {
                    if (this.mesh === focusTargetMesh) {
                        const desiredWorldPos = new THREE.Vector3(0, 2, 35);
                        const invMatrix = new THREE.Matrix4().copy(mainGroup.matrixWorld).invert();
                        target = desiredWorldPos.applyMatrix4(invMatrix);
                    } else {
                        target = this.posScatter;
                    }
                }

                const lerpSpeed = (mode === 'FOCUS' && this.mesh === focusTargetMesh) ? 5.0 : 2.0; 
                this.mesh.position.lerp(target, lerpSpeed * dt);

                if (mode === 'SCATTER') {
                    this.mesh.rotation.x += this.spinSpeed.x * dt;
                    this.mesh.rotation.y += this.spinSpeed.y * dt;
                    this.mesh.rotation.z += this.spinSpeed.z * dt; 
                } else if (mode === 'TREE') {
                    if (this.type === 'PHOTO') {
                        this.mesh.lookAt(0, this.mesh.position.y, 0);
                        this.mesh.rotateY(Math.PI);
                    } else {
                        this.mesh.rotation.x = THREE.MathUtils.lerp(this.mesh.rotation.x, 0, dt);
                        this.mesh.rotation.z = THREE.MathUtils.lerp(this.mesh.rotation.z, 0, dt);
                        this.mesh.rotation.y += 0.5 * dt; 
                    }
                }
                
                if (mode === 'FOCUS' && this.mesh === focusTargetMesh) {
                    this.mesh.lookAt(camera.position); 
                }

                let s = this.baseScale;
                if (this.isDust) {
                    s = this.baseScale * (0.8 + 0.4 * Math.sin(clock.elapsedTime * 4 + this.mesh.id));
                    if (mode === 'TREE') s = 0; 
                } else if (mode === 'SCATTER' && this.type === 'PHOTO') {
                    s = this.baseScale * 2.5; 
                } else if (mode === 'FOCUS') {
                    if (this.mesh === focusTargetMesh) s = 4.5; 
                    else s = this.baseScale * 0.8; 
                }
                
                this.mesh.scale.lerp(new THREE.Vector3(s,s,s), 4*dt);
            }
        }

        function updatePhotoLayout() {
            const photos = particleSystem.filter(p => p.type === 'PHOTO');
            const count = photos.length;
            if (count === 0) return;

            const h = CONFIG.particles.treeHeight * 0.9;
            const bottomY = -h/2;
            const stepY = h / count;
            const loops = 3;

            photos.forEach((p, i) => {
                const y = bottomY + stepY * i + stepY/2;
                const fullH = CONFIG.particles.treeHeight;
                const normalizedH = (y + fullH/2) / fullH; 

                let rMax = CONFIG.particles.treeRadius * (1.0 - normalizedH);
                if (rMax < 1.0) rMax = 1.0;
                
                // 紧贴圣诞树表面镶嵌照片，彻底消除“树外飘着一块碎片”的小 Bug！
                const r = rMax + 0.72; 
                const angle = normalizedH * Math.PI * 2 * loops + (Math.PI/4); 

                p.posTree.set(Math.cos(angle) * r, y, Math.sin(angle) * r);
            });
        }

        function createParticles() {
            const sphereGeo = new THREE.SphereGeometry(0.5, 32, 32); 
            const boxGeo = new THREE.BoxGeometry(0.55, 0.55, 0.55); 
            const curve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, -0.5, 0), new THREE.Vector3(0, 0.3, 0),
                new THREE.Vector3(0.1, 0.5, 0), new THREE.Vector3(0.3, 0.4, 0)
            ]);
            const candyGeo = new THREE.TubeGeometry(curve, 16, 0.08, 8, false);

            matGold = new THREE.MeshStandardMaterial({
                color: CONFIG.colors.champagneGold,
                metalness: 1.0, roughness: 0.1,
                envMapIntensity: 2.0, 
                emissive: 0x443300,   
                emissiveIntensity: 0.3
            });

            matGreen = new THREE.MeshStandardMaterial({
                color: CONFIG.colors.deepGreen,
                metalness: 0.2, roughness: 0.8,
                emissive: 0x002200,
                emissiveIntensity: 0.2 
            });

            matRed = new THREE.MeshPhysicalMaterial({
                color: CONFIG.colors.accentRed,
                metalness: 0.3, roughness: 0.2, clearcoat: 1.0,
                emissive: 0x330000
            });
            
            const candyMat = new THREE.MeshStandardMaterial({ map: caneTexture, roughness: 0.4 });

            for (let i = 0; i < CONFIG.particles.count; i++) {
                const rand = Math.random();
                let mesh, type;
                
                if (rand < 0.40) {
                    mesh = new THREE.Mesh(boxGeo, matGreen);
                    type = 'BOX';
                } else if (rand < 0.70) {
                    mesh = new THREE.Mesh(boxGeo, matGold);
                    type = 'GOLD_BOX';
                } else if (rand < 0.92) {
                    mesh = new THREE.Mesh(sphereGeo, matGold);
                    type = 'GOLD_SPHERE';
                } else if (rand < 0.97) {
                    mesh = new THREE.Mesh(sphereGeo, matRed);
                    type = 'RED';
                } else {
                    mesh = new THREE.Mesh(candyGeo, candyMat);
                    type = 'CANE';
                }

                const s = 0.4 + Math.random() * 0.5;
                mesh.scale.set(s,s,s);
                mesh.rotation.set(Math.random()*6, Math.random()*6, Math.random()*6);
                
                mainGroup.add(mesh);
                particleSystem.push(new Particle(mesh, type, false));
            }

            // Star
            const starShape = new THREE.Shape();
            const points = 5;
            const outerRadius = 1.5;
            const innerRadius = 0.7; 
            
            for (let i = 0; i < points * 2; i++) {
                const angle = (i * Math.PI) / points + Math.PI / 2;
                const r = (i % 2 === 0) ? outerRadius : innerRadius;
                const x = Math.cos(angle) * r;
                const y = Math.sin(angle) * r;
                if (i === 0) starShape.moveTo(x, y);
                else starShape.lineTo(x, y);
            }
            starShape.closePath();

            const starGeo = new THREE.ExtrudeGeometry(starShape, {
                depth: 0.4,
                bevelEnabled: true,
                bevelThickness: 0.1,
                bevelSize: 0.1,
                bevelSegments: 2
            });
            starGeo.center(); 

            matStar = new THREE.MeshStandardMaterial({
                color: 0xffdd88, emissive: 0xffaa00, emissiveIntensity: 1.0,
                metalness: 1.0, roughness: 0
            });
            const star = new THREE.Mesh(starGeo, matStar);
            star.position.set(0, CONFIG.particles.treeHeight/2 + 1.2, 0);
            mainGroup.add(star);
            
            mainGroup.add(photoMeshGroup);
        }

        function createDust() {
            const geo = new THREE.TetrahedronGeometry(0.08, 0);
            matDust = new THREE.MeshBasicMaterial({ color: 0xffeebb, transparent: true, opacity: 0.8 });
            
            for(let i=0; i<CONFIG.particles.dustCount; i++) {
                 const mesh = new THREE.Mesh(geo, matDust);
                 mesh.scale.setScalar(0.5 + Math.random());
                 mainGroup.add(mesh);
                 particleSystem.push(new Particle(mesh, 'DUST', true));
            }
        }

        // 3D 漫天细雪粒子
        function createSnow() {
            const count = 850;
            const geo = new THREE.BufferGeometry();
            snowPosArr = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                snowPosArr[i * 3]     = (Math.random() - 0.5) * 65;
                snowPosArr[i * 3 + 1] = (Math.random() - 0.5) * 50;
                snowPosArr[i * 3 + 2] = (Math.random() - 0.5) * 55;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(snowPosArr, 3));
            const mat = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.24,
                transparent: true,
                opacity: 0.72,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });
            snowPoints = new THREE.Points(geo, mat);
            scene.add(snowPoints);
        }

        function updateSnow(dt) {
            if (!snowPoints || !snowEnabled) return;
            const t = clock.elapsedTime;
            for (let i = 0; i < snowPosArr.length; i += 3) {
                snowPosArr[i]     += Math.sin(t * 0.8 + i) * 0.6 * dt;
                snowPosArr[i + 1] -= (2.2 + (i % 5) * 0.35) * dt;
                if (snowPosArr[i + 1] < -22) snowPosArr[i + 1] = 26;
            }
            snowPoints.geometry.attributes.position.needsUpdate = true;
        }

        // 一键清除树上所有照片
        function clearAllPhotos() {
            while (photoMeshGroup.children.length > 0) {
                const grp = photoMeshGroup.children[0];
                photoMeshGroup.remove(grp);
            }
            particleSystem = particleSystem.filter(p => p.type !== 'PHOTO');
            if (STATE.mode === 'FOCUS') {
                STATE.mode = 'TREE';

            }
            setStatus('已清空所有照片，可点击「传照片」重新挂上你的专属回忆');
        }

        function addPhotoToScene(texture) {
            const frameGeo = new THREE.BoxGeometry(1.4, 1.4, 0.05);
            const frameMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.champagneGold, metalness: 1.0, roughness: 0.1 });
            const frame = new THREE.Mesh(frameGeo, frameMat);

            // 保持宽高比
            let width = 1.2;
            let height = 1.2;
            
            if (texture.image) {
                const aspect = texture.image.width / texture.image.height;
                if (aspect > 1) {
                    height = width / aspect;
                } else {
                    width = height * aspect;
                }
            }

            const photoGeo = new THREE.PlaneGeometry(width, height);
            const photoMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
            const photo = new THREE.Mesh(photoGeo, photoMat);
            photo.position.z = 0.04;

            const group = new THREE.Group();
            group.add(frame);
            group.add(photo);
            
            // 调整框的大小以适应图片
            frame.scale.set(width/1.2, height/1.2, 1);

            const s = 0.8;
            group.scale.set(s,s,s);
            
            photoMeshGroup.add(group);
            particleSystem.push(new Particle(group, 'PHOTO', false));

            updatePhotoLayout();
        }
        
        function handleImageUpload(e) {
            const files = e.target.files;
            if(!files.length) return;
            
            Array.from(files).forEach(f => {
                // 过滤非图片文件 (针对文件夹上传时的系统文件等)
                if (!f.type.startsWith('image/')) return;

                const reader = new FileReader();
                reader.onload = (ev) => {
                    new THREE.TextureLoader().load(ev.target.result, (t) => {
                        t.colorSpace = THREE.SRGBColorSpace;
                        addPhotoToScene(t);
                    });
                }
                reader.readAsDataURL(f);
            });
        }

        // --- MEDIAPIPE（方案一：并行下载 + 本地Cache秒开 + 内存复用零重下 + 实时进度条）---
        let modelLoadingPromise = null;

        async function fetchModelBufferWithCache() {
            const CACHE_NAME = 'christmas-hand-model-v1';
            const CACHE_KEY = 'hand_landmarker_v1.task';
            const urls = [
                './hand_landmarker.task',
                './assets/hand_landmarker.task',
                'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'
            ];

            // 1) 优先从手机浏览器本地 Cache 秒读（第二次打开 0.3 秒就绪！）
            if ('caches' in window) {
                try {
                    const cache = await caches.open(CACHE_NAME);
                    const hit = await cache.match(CACHE_KEY);
                    if (hit) {
                        setStatus('已从本地缓存秒速唤醒手势引擎…');
                        return await hit.arrayBuffer();
                    }
                } catch (e) {}
            }

            // 2) 首次访问：流式拉取 + 实时百分比进度条 + 写入永久本地缓存
            let lastErr = null;
            for (const url of urls) {
                try {
                    const resp = await fetch(url);
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);

                    const total = parseInt(resp.headers.get('content-length') || '7818000', 10);
                    let buffer;

                    if (resp.body && resp.body.getReader) {
                        const reader = resp.body.getReader();
                        const chunks = [];
                        let loaded = 0, lastPct = -1;
                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            chunks.push(value);
                            loaded += value.byteLength;
                            const pct = Math.min(99, Math.round((loaded / total) * 100));
                            if (pct >= lastPct + 3) {
                                lastPct = pct;
                                setStatus(`手势引擎加载中 ${pct}% · 可先触屏旋转`);
                            }
                        }
                        const merged = new Uint8Array(loaded);
                        let offset = 0;
                        for (const c of chunks) { merged.set(c, offset); offset += c.byteLength; }
                        buffer = merged.buffer;
                    } else {
                        buffer = await resp.arrayBuffer();
                    }

                    // 写入浏览器本地 Cache，下次打开直接 0.3 秒秒开！
                    if ('caches' in window && buffer.byteLength > 1000000) {
                        try {
                            const cache = await caches.open(CACHE_NAME);
                            await cache.put(CACHE_KEY, new Response(buffer.slice(0), {
                                headers: { 'Content-Type': 'application/octet-stream' }
                            }));
                        } catch (e) {}
                    }
                    return buffer;
                } catch (e) {
                    lastErr = e;
                }
            }
            throw lastErr || new Error('Model fetch failed');
        }

        async function loadWasmVision() {
            const wasmBases = [
                'https://fastly.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm',
                'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm'
            ];
            let lastErr = null;
            for (const base of wasmBases) {
                try {
                    return await FilesetResolver.forVisionTasks(base);
                } catch (e) {
                    lastErr = e;
                }
            }
            throw lastErr || new Error('WASM load failed');
        }

        async function loadHandModel() {
            if (handLandmarker) return handLandmarker;
            if (modelLoadingPromise) return modelLoadingPromise;

            modelLoadingPromise = (async () => {
                setStatus('手势引擎加速加载中…（可先触屏旋转）');
                // WASM 引擎与 7.5MB 模型真正并行拉取，总耗时直接砍半！
                const [vision, modelBuf] = await Promise.all([
                    loadWasmVision(),
                    fetchModelBufferWithCache()
                ]);

                setStatus('正在启动 AI 手势识别…');
                let lastErr = null;
                // 使用内存 modelAssetBuffer，GPU 降级 CPU 绝不重复下载！
                for (const delegate of ['GPU', 'CPU']) {
                    try {
                        handLandmarker = await HandLandmarker.createFromOptions(vision, {
                            baseOptions: {
                                modelAssetBuffer: new Uint8Array(modelBuf.slice(0)),
                                delegate
                            },
                            runningMode: "VIDEO",
                            numHands: 1
                        });
                        modelReady = true;
                        return handLandmarker;
                    } catch (e) {
                        lastErr = e;
                    }
                }
                throw lastErr || new Error('HandLandmarker init failed');
            })();

            try {
                return await modelLoadingPromise;
            } catch (e) {
                modelLoadingPromise = null;
                throw e;
            }
        }

        async function startCamera(fromUserGesture = false) {
            const camBtn = document.getElementById('cam-btn');
            const wrapper = document.getElementById('webcam-wrapper');
            video = document.getElementById('webcam');
            webcamCanvas = document.getElementById('webcam-preview');
            webcamCtx = webcamCanvas.getContext('2d');
            webcamCanvas.width = 280;
            webcamCanvas.height = 210;

            if (!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                setStatus('需通过 HTTPS 打开才可调用手机摄像头（当前可触屏操作）');
                return false;
            }
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                setStatus('当前浏览器不支持摄像头（可触屏拖动/双击操作）');
                return false;
            }

            try {
                if (cameraRunning) {
                    const vis = wrapper.style.display !== 'none';
                    wrapper.style.display = vis ? 'none' : 'block';
                    camBtn.textContent = vis ? '显示摄像头' : '隐藏摄像头';
                    return true;
                }
                setStatus('正在请求前置摄像头权限…');
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: 'user' },
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                video.muted = true;
                video.setAttribute('playsinline', '');
                video.setAttribute('webkit-playsinline', '');
                await video.play();

                cameraRunning = true;
                wrapper.style.display = 'block';
                camBtn.textContent = '📷 隐藏画面';
                camBtn.classList.add('active');

                if (!predictLoopStarted) {
                    predictLoopStarted = true;
                    requestAnimationFrame(predictWebcam);
                }

                if (!modelReady) {
                    await loadHandModel();
                }
                setStatus('手势已就绪：握拳成树 · 张手散落 · 捏合看图');
                return true;
            } catch (e) {
                console.warn('Camera error:', e);
                wrapper.style.display = 'none';
                if (!fromUserGesture) {
                    setStatus('点击下方「📷 摄像头」即可隔空发光手势操控（或直接触屏）');
                } else {
                    setStatus('摄像头权限未开启，请在浏览器设置允许后重试（可触屏操作）');
                }
                return false;
            }
        }

        async function initMediaPipeBackground() {
            try {
                const modelPromise = loadHandModel().catch(err => {
                    console.warn('Hand model load error:', err);
                    setStatus('手势模型加载较慢，当前支持触屏拖动与双击切换');
                });
                await startCamera(false);
                await modelPromise;
                if (cameraRunning && modelReady) {
                    setStatus('手势已就绪：握拳成树 · 张手散落 · 捏合看图');
                }
            } catch (e) {
                console.warn('initMediaPipeBackground error:', e);
            }
        }

        // --- 抖音爆款同款：发光魔法手掌骨骼 + 主屏指尖星光光效 ---
        const HAND_BONES = [
            [0,1],[1,2],[2,3],[3,4],
            [0,5],[5,6],[6,7],[7,8],
            [5,9],[9,10],[10,11],[11,12],
            [9,13],[13,14],[14,15],[15,16],
            [13,17],[17,18],[18,19],[19,20],[0,17]
        ];
        const FINGERTIPS = [4, 8, 12, 16, 20];
        const skelCanvas = document.getElementById('webcam-skeleton');
        const skelCtx = skelCanvas.getContext('2d');
        const magicCanvas = document.getElementById('hand-magic-canvas');
        const magicCtx = magicCanvas.getContext('2d');
        const magicSparks = [];
        let smoothHandX = 0, smoothHandY = 0;
        let lastGestureLabel = '', gestureStableCount = 0, pendingMode = '';
        let latestLandmarks = null;

        function resizeMagicCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            magicCanvas.width = Math.floor(window.innerWidth * dpr);
            magicCanvas.height = Math.floor(window.innerHeight * dpr);
            magicCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resizeMagicCanvas();

        function spawnMagicSpark(x, y, burst = false) {
            const n = burst ? 14 : 2;
            for (let i = 0; i < n; i++) {
                if (magicSparks.length > 160) magicSparks.shift();
                const ang = Math.random() * Math.PI * 2;
                const sp = burst ? (60 + Math.random() * 140) : (12 + Math.random() * 32);
                magicSparks.push({
                    x, y,
                    vx: Math.cos(ang) * sp,
                    vy: Math.sin(ang) * sp - (burst ? 10 : 22),
                    r: burst ? (1.8 + Math.random() * 2.6) : (1.2 + Math.random() * 2.0),
                    life: 0,
                    maxLife: burst ? (0.55 + Math.random() * 0.45) : (0.45 + Math.random() * 0.45),
                    color: activeGlowHex
                });
            }
        }

        function drawWebcamSkeleton(lm, isPinch) {
            const w = skelCanvas.clientWidth || 180;
            const h = skelCanvas.clientHeight || 135;
            if (skelCanvas.width !== w || skelCanvas.height !== h) {
                skelCanvas.width = w; skelCanvas.height = h;
            }
            skelCtx.clearRect(0, 0, w, h);
            if (!lm) return;

            skelCtx.save();
            skelCtx.shadowColor = activeGlowHex;
            skelCtx.shadowBlur = 12;
            skelCtx.strokeStyle = activeGlowHex;
            skelCtx.lineWidth = 2.0;
            skelCtx.lineCap = 'round';

            // 镜像绘制 21 点发光手掌骨骼（与镜像视频完全对齐！）
            skelCtx.beginPath();
            for (const [a, b] of HAND_BONES) {
                const pa = lm[a], pb = lm[b];
                skelCtx.moveTo((1 - pa.x) * w, pa.y * h);
                skelCtx.lineTo((1 - pb.x) * w, pb.y * h);
            }
            skelCtx.stroke();

            // 绘制关节与高光指尖星点
            for (let i = 0; i < lm.length; i++) {
                const px = (1 - lm[i].x) * w, py = lm[i].y * h;
                const isTip = FINGERTIPS.includes(i);
                skelCtx.fillStyle = isTip ? '#ffffff' : activeGlowHex;
                skelCtx.beginPath();
                skelCtx.arc(px, py, isTip ? 3.8 : 2.1, 0, Math.PI * 2);
                skelCtx.fill();
            }

            // 捏合瞬间：拇指与食指之间绽放高光魔法圆环
            if (isPinch) {
                const mx = (1 - (lm[4].x + lm[8].x) * 0.5) * w;
                const my = ((lm[4].y + lm[8].y) * 0.5) * h;
                skelCtx.strokeStyle = '#ffffff';
                skelCtx.lineWidth = 2.4;
                skelCtx.beginPath();
                skelCtx.arc(mx, my, 10, 0, Math.PI * 2);
                skelCtx.stroke();
            }
            skelCtx.restore();
        }

        function updateHandMagicFx(dt) {
            const W = window.innerWidth, H = window.innerHeight;
            magicCtx.clearRect(0, 0, W, H);
            magicCtx.save();
            magicCtx.globalCompositeOperation = 'lighter';

            // 如果检测到手掌，在主屏同步渲染柔和发光的「魔法掌心光环 + 指尖星点」
            if (STATE.hand.detected && latestLandmarks) {
                const lm = latestLandmarks;
                const palmX = (1 - lm[9].x) * W;
                const palmY = lm[9].y * H;

                const grad = magicCtx.createRadialGradient(palmX, palmY, 2, palmX, palmY, 54);
                grad.addColorStop(0, 'rgba(255,255,255,0.55)');
                grad.addColorStop(0.35, activeGlowHex + '66');
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                magicCtx.fillStyle = grad;
                magicCtx.beginPath();
                magicCtx.arc(palmX, palmY, 54, 0, Math.PI * 2);
                magicCtx.fill();

                // 五指指尖跟随星芒
                for (const idx of FINGERTIPS) {
                    const fx = (1 - lm[idx].x) * W;
                    const fy = lm[idx].y * H;
                    const fg = magicCtx.createRadialGradient(fx, fy, 0, fx, fy, 16);
                    fg.addColorStop(0, 'rgba(255,255,255,0.92)');
                    fg.addColorStop(0.45, activeGlowHex + '88');
                    fg.addColorStop(1, 'rgba(0,0,0,0)');
                    magicCtx.fillStyle = fg;
                    magicCtx.beginPath();
                    magicCtx.arc(fx, fy, 16, 0, Math.PI * 2);
                    magicCtx.fill();
                }

                if (Math.random() < 0.65) {
                    const tipIdx = FINGERTIPS[Math.floor(Math.random() * FINGERTIPS.length)];
                    spawnMagicSpark((1 - lm[tipIdx].x) * W, lm[tipIdx].y * H, false);
                }
            }

            // 更新并绘制漂浮魔法星尘
            for (let i = magicSparks.length - 1; i >= 0; i--) {
                const s = magicSparks[i];
                s.life += dt;
                if (s.life >= s.maxLife) { magicSparks.splice(i, 1); continue; }
                s.x += s.vx * dt;
                s.y += s.vy * dt;
                const a = 1 - s.life / s.maxLife;
                magicCtx.globalAlpha = a * 0.9;
                magicCtx.fillStyle = '#ffffff';
                magicCtx.shadowColor = s.color;
                magicCtx.shadowBlur = 10;
                magicCtx.beginPath();
                magicCtx.arc(s.x, s.y, s.r * a, 0, Math.PI * 2);
                magicCtx.fill();
            }
            magicCtx.restore();
        }

        function setGestureBadge(text, show) {
            const badge = document.getElementById('gesture-badge');
            if (!badge) return;
            if (show) {
                badge.textContent = text;
                badge.classList.add('active');
            } else {
                badge.classList.remove('active');
            }
        }

        // --- 程序化圣诞八音盒 BGM（0 外部文件，清脆治愈！）---
        let musicCtx = null, musicPlaying = false, musicTimer = null, musicStep = 0;
        const MUSIC_NOTES = [
            // We Wish You a Merry Christmas + Jingle Bells 清脆八音盒旋律
            [392, 0.35], [523.25, 0.35], [523.25, 0.18], [587.33, 0.18], [523.25, 0.18], [493.88, 0.18],
            [440, 0.35], [440, 0.35], [440, 0.35], [587.33, 0.35], [587.33, 0.18], [659.25, 0.18],
            [587.33, 0.18], [523.25, 0.18], [493.88, 0.35], [392, 0.35], [392, 0.35],
            [659.25, 0.35], [659.25, 0.18], [698.46, 0.18], [659.25, 0.18], [587.33, 0.18], [523.25, 0.35],
            [440, 0.35], [392, 0.18], [392, 0.18], [440, 0.35], [587.33, 0.35], [493.88, 0.35], [523.25, 0.70]
        ];
        function playMusicNote(freq, dur) {
            if (!musicCtx) return;
            const now = musicCtx.currentTime;
            const osc = musicCtx.createOscillator();
            const overtone = musicCtx.createOscillator();
            const g = musicCtx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(freq * 2, now);
            overtone.type = 'triangle'; overtone.frequency.setValueAtTime(freq * 4, now);
            g.gain.setValueAtTime(0.0005, now);
            g.gain.linearRampToValueAtTime(0.055, now + 0.015);
            g.gain.exponentialRampToValueAtTime(0.0004, now + dur * 2.2);
            const og = musicCtx.createGain(); og.gain.value = 0.16;
            osc.connect(g); overtone.connect(og).connect(g); g.connect(musicCtx.destination);
            osc.start(now); overtone.start(now);
            osc.stop(now + dur * 2.3); overtone.stop(now + dur * 2.3);
        }
        function scheduleMusicNext() {
            if (!musicPlaying) return;
            const [freq, dur] = MUSIC_NOTES[musicStep % MUSIC_NOTES.length];
            musicStep++;
            playMusicNote(freq, dur);
            musicTimer = setTimeout(scheduleMusicNext, dur * 1000);
        }
        function toggleMusicBox() {
            const btn = document.getElementById('music-btn');
            if (musicPlaying) {
                musicPlaying = false;
                clearTimeout(musicTimer);
                btn.classList.remove('active');
                btn.textContent = '🎵 八音盒';
            } else {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return;
                if (!musicCtx) musicCtx = new AC();
                if (musicCtx.state === 'suspended') musicCtx.resume().catch(() => {});
                musicPlaying = true;
                btn.classList.add('active');
                btn.textContent = '🔊 播放中';
                scheduleMusicNext();
            }
        }

        let lastVideoTime = -1;
        async function predictWebcam() {
            if (cameraRunning && video && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                if (handLandmarker) {
                    try {
                        const result = handLandmarker.detectForVideo(video, performance.now());
                        processGestures(result);
                    } catch (e) {
                        // 忽略偶发帧检测异常，保证渲染循环不中断
                    }
                }
            }
            requestAnimationFrame(predictWebcam);
        }

        function processGestures(result) {
            if (result.landmarks && result.landmarks.length > 0) {
                STATE.hand.detected = true;
                const lm = result.landmarks[0];
                latestLandmarks = lm;

                // 平滑滤波手掌坐标，跟手更丝滑不抖动！
                const rawX = (lm[9].x - 0.5) * 2;
                const rawY = (lm[9].y - 0.5) * 2;
                smoothHandX += (rawX - smoothHandX) * 0.38;
                smoothHandY += (rawY - smoothHandY) * 0.38;
                STATE.hand.x = smoothHandX;
                STATE.hand.y = smoothHandY;

                const thumb = lm[4]; const index = lm[8]; const wrist = lm[0];
                const pinchDist = Math.hypot(thumb.x - index.x, thumb.y - index.y);
                const tips = [lm[8], lm[12], lm[16], lm[20]];
                let avgDist = 0;
                tips.forEach(t => avgDist += Math.hypot(t.x - wrist.x, t.y - wrist.y));
                avgDist /= 4;

                const isPinch = pinchDist < 0.068;
                drawWebcamSkeleton(lm, isPinch);

                let detectedMode = STATE.mode;
                let badgeText = '✨ 手掌已锁定 · 移动可旋转';
                if (isPinch) {
                    detectedMode = 'FOCUS';
                    badgeText = '👌 捏合 · 聚焦专属照片';
                } else if (avgDist < 0.27) {
                    detectedMode = 'TREE';
                    badgeText = '✊ 握拳 · 聚拢圣诞树';
                } else if (avgDist > 0.36) {
                    detectedMode = 'SCATTER';
                    badgeText = '🖐️ 张手 · 星空散落随手旋转';
                }

                // 2 帧轻防抖，既灵敏又不误触！
                if (detectedMode === pendingMode) {
                    gestureStableCount++;
                } else {
                    pendingMode = detectedMode;
                    gestureStableCount = 1;
                }

                if (gestureStableCount >= 2 && detectedMode !== STATE.mode) {
                    const prevMode = STATE.mode;
                    STATE.mode = detectedMode;
                    const burstX = (1 - lm[9].x) * window.innerWidth;
                    const burstY = lm[9].y * window.innerHeight;
                    spawnMagicSpark(burstX, burstY, true);

                    if (detectedMode === 'FOCUS') {
                        const photos = particleSystem.filter(p => p.type === 'PHOTO');
                        if (photos.length) {
                            STATE.focusTarget = photos[Math.floor(Math.random() * photos.length)].mesh;
                        } else {
                            badgeText = '👌 还没有照片哦，点下方「传照片」挂上吧';
                        }
                    } else if (prevMode !== detectedMode) {
                        STATE.focusTarget = null;
                    }
                }
                setGestureBadge(badgeText, true);
            } else {
                STATE.hand.detected = false;
                latestLandmarks = null;
                drawWebcamSkeleton(null, false);
                setGestureBadge('', false);
            }
        }

        function setupEvents() {
            window.addEventListener('resize', () => {
                const aspect = window.innerWidth / window.innerHeight;
                camera.aspect = aspect;
                camera.position.z = aspect < 0.85 ? 64 : CONFIG.camera.z;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
                resizeMagicCanvas();
            });

            // 5 套高定圣诞树颜色 + 自由调色盘
            document.querySelectorAll('.theme-dot').forEach(dot => {
                dot.addEventListener('click', () => {
                    applyTheme(dot.dataset.theme);
                    setStatus(`已切换主题：${THEMES[dot.dataset.theme].name}`);
                });
            });
            document.getElementById('custom-color').addEventListener('input', (e) => {
                applyCustomColor(e.target.value);
                setStatus('已应用自定义圣诞树色彩 ✨');
            });

            // 点击开启 / 显隐前置手势摄像头
            document.getElementById('cam-btn').addEventListener('click', () => startCamera(true));
            
            // 上传照片 & 一键清空照片
            document.getElementById('file-input').addEventListener('change', (e) => {
                handleImageUpload(e);
                e.target.value = '';
                setStatus('已将你的照片挂上圣诞树，捏合手指可聚焦查看！');
            });
            document.getElementById('clear-photos-btn').addEventListener('click', clearAllPhotos);

            // 3D 飘雪开关
            const snowBtn = document.getElementById('snow-btn');
            snowBtn.addEventListener('click', () => {
                snowEnabled = !snowEnabled;
                if (snowPoints) snowPoints.visible = snowEnabled;
                snowBtn.classList.toggle('active', snowEnabled);
            });

            // 圣诞八音盒 BGM 开关
            document.getElementById('music-btn').addEventListener('click', toggleMusicBox);

            // 纯净欣赏 / 截图隐藏 UI 按钮
            const pureBtn = document.getElementById('pure-btn');
            pureBtn.addEventListener('click', () => {
                const pure = document.body.classList.toggle('pure-mode');
                pureBtn.textContent = pure ? '✨' : '👁️';
            });

            // 定制祝福语 & 生成专属分享链接弹窗
            const modal = document.getElementById('share-modal');
            const openModal = () => { modal.classList.add('open'); document.getElementById('copy-tip').textContent = '链接会自动记住你的祝福语和圣诞树配色，发给好友点开即见！'; };
            document.getElementById('share-btn').addEventListener('click', openModal);
            document.getElementById('main-title').addEventListener('click', openModal);
            document.getElementById('modal-close').addEventListener('click', () => modal.classList.remove('open'));
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });

            const greetingInput = document.getElementById('greeting-input');
            greetingInput.addEventListener('input', () => {
                const v = greetingInput.value.trim() || 'Merry Christmas';
                document.getElementById('main-title').textContent = v;
            });

            document.getElementById('copy-link-btn').addEventListener('click', async () => {
                const title = greetingInput.value.trim() || 'Merry Christmas';
                document.getElementById('main-title').textContent = title;
                const url = new URL(location.origin + location.pathname);
                url.searchParams.set('to', title);
                if (activeThemeKey === 'custom' && activeCustomHex) {
                    url.searchParams.set('color', activeCustomHex);
                } else {
                    url.searchParams.set('theme', activeThemeKey);
                }
                const shareStr = url.toString();
                try {
                    await navigator.clipboard.writeText(shareStr);
                    document.getElementById('copy-tip').textContent = '✅ 专属链接已复制！快去微信/抖音发给 TA 吧';
                } catch (e) {
                    prompt('请长按复制你的专属圣诞树链接：', shareStr);
                }
            });

            // 手机触屏备用操控：单指拖动旋转，双击切换 圣诞树 / 星空散落 / 聚焦照片
            let dragging = false, lastX = 0, lastY = 0, lastTap = 0;
            const canvasEl = renderer.domElement;
            canvasEl.addEventListener('pointerdown', (e) => {
                dragging = true; lastX = e.clientX; lastY = e.clientY;
                const now = Date.now();
                if (now - lastTap < 280) {
                    if (STATE.mode === 'TREE') {
                        STATE.mode = 'SCATTER'; STATE.focusTarget = null;
                    } else if (STATE.mode === 'SCATTER') {
                        const photos = particleSystem.filter(p => p.type === 'PHOTO');
                        if (photos.length) {
                            STATE.mode = 'FOCUS';
                            STATE.focusTarget = photos[Math.floor(Math.random() * photos.length)].mesh;
                        } else {
                            STATE.mode = 'TREE';
                        }
                    } else {
                        STATE.mode = 'TREE'; STATE.focusTarget = null;
                    }
                }
                lastTap = now;
            });
            window.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                const dx = e.clientX - lastX, dy = e.clientY - lastY;
                lastX = e.clientX; lastY = e.clientY;
                STATE.rotation.y += dx * 0.008;
                STATE.rotation.x = Math.max(-0.6, Math.min(0.6, STATE.rotation.x + dy * 0.005));
            });
            window.addEventListener('pointerup', () => { dragging = false; });
            window.addEventListener('pointercancel', () => { dragging = false; });
            
            window.addEventListener('keydown', (e) => {
                if (document.activeElement === greetingInput) return;
                if (e.key.toLowerCase() === 'h') {
                    const pure = document.body.classList.toggle('pure-mode');
                    pureBtn.textContent = pure ? '✨' : '👁️';
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            // 增强手势跟手体验：散落与成树状态下，只要识别到手掌移动即可丝滑带动旋转！
            if (STATE.hand.detected && STATE.mode !== 'FOCUS') {
                const multY = STATE.mode === 'SCATTER' ? 1.05 : 0.65;
                const targetRotY = -STATE.hand.x * Math.PI * multY;
                const targetRotX = STATE.hand.y * Math.PI * 0.22;
                STATE.rotation.y += (targetRotY - STATE.rotation.y) * 3.8 * dt;
                STATE.rotation.x += (targetRotX - STATE.rotation.x) * 3.2 * dt;
            } else {
                if (STATE.mode === 'TREE') {
                    STATE.rotation.y += 0.3 * dt;
                    STATE.rotation.x += (0 - STATE.rotation.x) * 2.0 * dt;
                } else {
                    STATE.rotation.y += 0.1 * dt; 
                }
            }

            mainGroup.rotation.y = STATE.rotation.y;
            mainGroup.rotation.x = STATE.rotation.x;

            updateSnow(dt);
            updateHandMagicFx(dt);
            particleSystem.forEach(p => p.update(dt, STATE.mode, STATE.focusTarget));
            composer.render();
        }

        init();
    </script>
